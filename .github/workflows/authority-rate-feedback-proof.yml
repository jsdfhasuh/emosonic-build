name: Follow authority rate feedback expected-red proof

on:
  push:
    branches: [main]
    paths: [requests/authority-rate-feedback-proof-20261023.json]

permissions:
  contents: read

concurrency:
  group: emosonic-authority-rate-feedback-proof-20261023
  cancel-in-progress: false

env:
  SOURCE_SHA: 'b1fd7295c7af882a772bb66e32ea0f61b1dc626c'
  BUILD_VERSION: '1.0.10+27'

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: >-
      github.repository == 'jsdfhasuh/emosonic-build' && github.ref == 'refs/heads/main' &&
      github.event_name == 'push' && github.event.before == '5b261eb360f7e04dce0352086bd99e1deafac954' &&
      github.event.head_commit.message == 'test: prove authority rate feedback ownership 20261023' && github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check public gate logic
        run: python3 -m unittest discover -s tests -v
      - name: Verify immutable unchanged-algorithm baseline pin
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          SOURCE_REF: refs/heads/test/native-rate-feedback-20261023
        run: python3 scripts/authority_rate_feedback_proof.py source prepare

  expected-red:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: android-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: false
      - name: Fetch fixed private unchanged-controller baseline
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: python3 scripts/authority_rate_feedback_proof.py source fetch
      - name: Require sole causal failure and every successful control
        run: python3 scripts/authority_rate_feedback_proof.py source red
      - name: Remove private source and generated outputs
        if: always()
        run: python3 scripts/authority_rate_feedback_proof.py source cleanup
