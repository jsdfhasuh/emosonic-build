name: Follow ordinary positive-slew settlement expected-red proof

on:
  push:
    branches: [main]
    paths: [requests/follow-ordinary-settle-proof-20261024.json]

permissions:
  contents: read

concurrency:
  group: emosonic-follow-ordinary-settle-proof-20261024
  cancel-in-progress: false

env:
  SOURCE_SHA: '7c99e38ecf68cf157bc08b2cf3bae8ce273d54b3'
  BUILD_VERSION: '1.0.10+27'

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: >-
      github.repository == 'jsdfhasuh/emosonic-build' && github.ref == 'refs/heads/main' &&
      github.event_name == 'push' && github.event.before == '4cf220d7a7228cbe168860ff1d9af071225fc6eb' &&
      github.event.head_commit.message == 'test: prove ordinary Follow settlement debt 20261024' && github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check public gate logic
        run: python3 -m unittest discover -s tests -v
      - name: Verify immutable unchanged-algorithm baseline pin
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          SOURCE_REF: refs/heads/test/follow-smooth-settlement-20261024
        run: python3 scripts/follow_ordinary_settle_proof.py source prepare

  expected-red:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: android-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: false
      - name: Fetch fixed private unchanged-controller baseline
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: python3 scripts/follow_ordinary_settle_proof.py source fetch
      - name: Require sole causal failure and every successful control
        run: python3 scripts/follow_ordinary_settle_proof.py source red
      - name: Remove private source and generated outputs
        if: always()
        run: python3 scripts/follow_ordinary_settle_proof.py source cleanup
