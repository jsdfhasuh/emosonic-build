name: Bounded Follow recovery budget full source validation

on:
  push:
    branches: [main]
    paths: [requests/follow-bounded-budget-green-20261024.json]

permissions:
  contents: read

concurrency:
  group: emosonic-follow-bounded-budget-green-20261024
  cancel-in-progress: false

env:
  SOURCE_SHA: 'bfc1967a8eae65154bdd5e74491f99136dfc198d'
  BUILD_VERSION: '1.0.10+27'

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: >-
      github.repository == 'jsdfhasuh/emosonic-build' && github.ref == 'refs/heads/main' &&
      github.event_name == 'push' && github.event.before == 'a65819318279f53c06fd8d19794959c39d6b00e8' &&
      github.event.head_commit.message == 'test: validate dedicated bounded Follow recovery budget 20261024' && github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-build
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test public pipeline logic
        run: python3 -m unittest discover -s tests -v
      - name: Verify the exact reviewed source for source-only validation
        id: prepare
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REF: refs/heads/fix/follow-bounded-budget-20261024
        run: python3 scripts/follow_bounded_budget_green.py source prepare

  validate-source:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: android-build
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: false
      - name: Fetch the exact frozen source without retaining credentials
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: python3 scripts/follow_bounded_budget_green.py source fetch
      - name: Validate all 282 historical and bounded budget focused cases
        run: python3 scripts/follow_bounded_budget_green.py source focused
      - name: Validate complete source analysis, tests, provenance and byte integrity without user Secrets
        run: python3 scripts/follow_bounded_budget_green.py source validate_source
      - name: Remove private source and generated validation outputs
        if: always()
        run: python3 scripts/follow_bounded_budget_green.py source cleanup
