name: Repaired native Handoff and Follow matrix

on:
  push:
    branches: [main]
    paths: [requests/handoff-follow-timing-20261022.json]

permissions:
  contents: read

concurrency:
  group: emosonic-handoff-follow-timing-20261022
  cancel-in-progress: false

env:
  SOURCE_SHA: 'c7301a107fd1474ec0d22bb609426a435bc52584'
  BUILD_VERSION: '1.0.10+27'

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: >-
      github.repository == 'jsdfhasuh/emosonic-build' && github.ref == 'refs/heads/main' &&
      github.event_name == 'push' && github.event.before == '40f189553c4ded3d7ab7bb7170f868478f041c41' &&
      github.event.head_commit.message == 'test: repeat fractional native precision matrix 20261023' && github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-build
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      version: ${{ steps.prepare.outputs.version }}
      apk_name: ${{ steps.prepare.outputs.apk_name }}
      installer_name: ${{ steps.prepare.outputs.installer_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test public pipeline logic
        run: python3 -m unittest discover -s tests -v
      - name: Verify fixed source for build-only same-version rebuild
        id: prepare
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REF: refs/heads/fix/follow-fractional-precision-20261023
        run: python3 scripts/handoff_follow_timing.py source prepare

  native-macos-server:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 55
    environment: android-build
    env:
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      # Explicit user approval for only these disposable test app entitlements.
      EMOSONIC_MAC_LAB_NETWORK_APPROVED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch fixed private client without retained credentials
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: python3 scripts/handoff_follow_timing.py source fetch
      - name: Checkout fixed public isolated server
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jsdfhasuh/Emosonic-Server
          ref: 5adc23da173c5f20188d79aafe8fcc1e656eb38a
          path: .native-server
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pin server and admit read-only seek-aware harness instrumentation
        run: python3 scripts/handoff_follow_timing.py native prepare
      - name: Install real isolated server dependencies without logging private output
        run: python3 scripts/handoff_follow_timing.py native dependencies
      - name: Validate native measurement boundaries
        run: python3 scripts/handoff_follow_timing.py native unit
      - name: Preflight actual HTTP media and strict registration before compilation
        run: python3 scripts/handoff_follow_timing.py native preflight
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: false
      - name: Prove actual scoped stream attribution and admit disposable lab-only decoration
        run: python3 scripts/handoff_follow_timing.py native attribution
      - name: Compile three sandboxed same-source native test clients
        run: python3 scripts/handoff_follow_timing.py native build
      - name: Measure actual follower transfer and restoration
        run: python3 scripts/handoff_follow_timing.py native follow
      - name: Measure normal delayed and cancelled actual Handoff
        run: python3 scripts/handoff_follow_timing.py native handoff
      - name: Verify native processes stopped and remove owned test bundles and server
        id: native-cleanup
        if: always()
        run: python3 scripts/handoff_follow_timing.py native cleanup
      - name: Remove private source and build diagnostics after verified native teardown
        if: ${{ always() && steps.native-cleanup.outcome == 'success' }}
        run: python3 scripts/handoff_follow_timing.py source cleanup
      # No native test bundles, private profiles, raw logs or source artifacts uploaded.
