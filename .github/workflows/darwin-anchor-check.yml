name: Modern macOS native position anchor verification

on:
  push:
    branches: [main]
    paths: [requests/darwin-anchor-check-20261022.json]

permissions:
  contents: read

concurrency:
  group: emosonic-darwin-anchor-check-20261022
  cancel-in-progress: false

env:
  SOURCE_SHA: '1efc826b85c305bd60210aa705444114c1a0d5e2'
  BUILD_VERSION: '1.0.10+27'

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: >-
      github.repository == 'jsdfhasuh/emosonic-build' && github.ref == 'refs/heads/main' &&
      github.event_name == 'push' && github.event.before == 'be056c4086460cad87f32e2049d86b2b46d64f5f' &&
      github.event.head_commit.message == 'test: prove modern macOS position anchor repair 20261022' && github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-build
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      version: ${{ steps.prepare.outputs.version }}
      apk_name: ${{ steps.prepare.outputs.apk_name }}
      installer_name: ${{ steps.prepare.outputs.installer_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test public pipeline logic
        run: python3 -m unittest discover -s tests -v
      - name: Verify fixed source for build-only same-version rebuild
        id: prepare
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REF: refs/heads/fix/darwin-position-anchor-20261022
        run: python3 scripts/darwin_anchor_check.py source prepare

  validate-source:
    needs: [prepare, native-anchor]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: android-build
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: false
      - name: Fetch the exact frozen source without retaining credentials
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: python3 scripts/darwin_anchor_check.py source fetch
      - name: Validate complete source analysis, tests, provenance and byte integrity without user Secrets
        run: python3 scripts/darwin_anchor_check.py source validate_source
      - name: Remove private source and generated validation outputs
        if: always()
        run: python3 scripts/darwin_anchor_check.py source cleanup

  native-anchor:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 15
    environment: android-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch exact test-only baseline without retained credentials
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: python3 scripts/darwin_anchor_check.py regression fetch-baseline
      - name: Require exact modern native anchor causal failure
        run: python3 scripts/darwin_anchor_check.py regression red
      - name: Remove baseline before fixed checkout
        run: python3 scripts/darwin_anchor_check.py source cleanup
      - name: Fetch exact reviewed fixed candidate without retained credentials
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: python3 scripts/darwin_anchor_check.py source fetch
      - name: Validate unchanged regression and all native lifecycle guards
        run: python3 scripts/darwin_anchor_check.py regression green
      - name: Remove owned private source and native test outputs
        if: always()
        run: python3 scripts/darwin_anchor_check.py regression cleanup
      # No bundles, private sources, raw logs or compiler diagnostics uploaded.
