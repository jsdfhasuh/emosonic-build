name: Follow fractional precision expected-red proof

on:
  push:
    branches: [main]
    paths: [requests/fractional-precision-proof-20261023.json]

permissions:
  contents: read

concurrency:
  group: emosonic-fractional-precision-proof-20261023
  cancel-in-progress: false

env:
  SOURCE_SHA: '183716155d5424471b59a990154acf4772477be8'
  BUILD_VERSION: '1.0.10+27'

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: >-
      github.repository == 'jsdfhasuh/emosonic-build' && github.ref == 'refs/heads/main' &&
      github.event_name == 'push' && github.event.before == '208edd8a07916465c33d4c2d2828def1f58eeb5d' &&
      github.event.head_commit.message == 'test: prove fractional native precision boundary 20261023' && github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check public gate logic
        run: python3 -m unittest discover -s tests -v
      - name: Verify immutable unchanged-algorithm baseline pin
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          SOURCE_REF: refs/heads/test/follow-fractional-precision-20261023
        run: python3 scripts/fractional_precision_proof.py source prepare

  expected-red:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: android-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: false
      - name: Fetch fixed private unchanged-controller baseline
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: python3 scripts/fractional_precision_proof.py source fetch
      - name: Require sole causal failure and every successful control
        run: python3 scripts/fractional_precision_proof.py source red
      - name: Remove private source and generated outputs
        if: always()
        run: python3 scripts/fractional_precision_proof.py source cleanup
