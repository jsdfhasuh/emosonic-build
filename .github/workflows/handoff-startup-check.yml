name: Handoff startup real-service red-green verification

on:
  push:
    branches: [main]
    paths: [requests/handoff-startup-20261022.json]

permissions:
  contents: read

concurrency:
  group: emosonic-handoff-startup-20261022
  cancel-in-progress: false

env:
  SOURCE_SHA: '01967c853a4e6020097e9a2da61f9785b470ff7d'
  BUILD_VERSION: '1.0.10+27'

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: >-
      github.repository == 'jsdfhasuh/emosonic-build' && github.ref == 'refs/heads/main' &&
      github.event_name == 'push' && github.event.before == 'fab6e5994438d005b9815bcc57353362d288f65f' &&
      github.event.head_commit.message == 'test: verify ordinary startup lease regression 20261022' && github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-build
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      version: ${{ steps.prepare.outputs.version }}
      apk_name: ${{ steps.prepare.outputs.apk_name }}
      installer_name: ${{ steps.prepare.outputs.installer_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test public pipeline logic
        run: python3 -m unittest discover -s tests -v
      - name: Verify fixed source for build-only same-version rebuild
        id: prepare
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REF: refs/heads/fix/handoff-play-initiation-20261022
        run: python3 scripts/handoff_startup_check.py source prepare

  validate-source:
    needs: [prepare, red-baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: android-build
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: false
      - name: Fetch the exact frozen source without retaining credentials
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: python3 scripts/handoff_startup_check.py source fetch
      - name: Validate complete source analysis, tests, provenance and byte integrity without user Secrets
        run: python3 scripts/handoff_startup_check.py source validate_source
      - name: Remove private source and generated validation outputs
        if: always()
        run: python3 scripts/handoff_startup_check.py source cleanup

  red-baseline:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: android-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: false
      - name: Fetch fixed test-only baseline without persisted credentials
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: python3 scripts/handoff_startup_check.py regression fetch-baseline
      - name: Require exact intentional held-policy regression failure on unfixed source
        run: python3 scripts/handoff_startup_check.py regression red
      - name: Remove private baseline and generated diagnostics
        if: always()
        run: python3 scripts/handoff_startup_check.py source cleanup

