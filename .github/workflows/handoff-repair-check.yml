name: Handoff repair red-green and native verification

on:
  push:
    branches: [main]
    paths: [requests/handoff-repair-20261022.json]

permissions:
  contents: read

concurrency:
  group: emosonic-handoff-repair-20261022
  cancel-in-progress: false

env:
  SOURCE_SHA: '19639161be7945884d998ecd268d9bc30afcf02d'
  BUILD_VERSION: '1.0.10+27'

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: >-
      github.repository == 'jsdfhasuh/emosonic-build' && github.ref == 'refs/heads/main' &&
      github.event_name == 'push' && github.event.before == '4afe4129c8a889f116e1f866928395da7b35a8cb' &&
      github.event.head_commit.message == 'test: verify bounded handoff start repair 20261022' && github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-build
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      version: ${{ steps.prepare.outputs.version }}
      apk_name: ${{ steps.prepare.outputs.apk_name }}
      installer_name: ${{ steps.prepare.outputs.installer_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test public pipeline logic
        run: python3 -m unittest discover -s tests -v
      - name: Verify fixed source for build-only same-version rebuild
        id: prepare
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REF: refs/heads/fix/handoff-play-initiation-20261022
        run: python3 scripts/handoff_repair_check.py source prepare

  validate-source:
    needs: [prepare, red-baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: android-build
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      BUILD_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: false
      - name: Fetch the exact frozen source without retaining credentials
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: python3 scripts/handoff_repair_check.py source fetch
      - name: Validate complete source analysis, tests, provenance and byte integrity without user Secrets
        run: python3 scripts/handoff_repair_check.py source validate_source
      - name: Remove private source and generated validation outputs
        if: always()
        run: python3 scripts/handoff_repair_check.py source cleanup

  red-baseline:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: android-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: false
      - name: Fetch fixed test-only baseline without persisted credentials
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: python3 scripts/handoff_repair_check.py regression fetch-baseline
      - name: Require exact intentional held-policy regression failure on unfixed source
        run: python3 scripts/handoff_repair_check.py regression red
      - name: Remove private baseline and generated diagnostics
        if: always()
        run: python3 scripts/handoff_repair_check.py source cleanup

  native-macos-server:
    needs: [prepare, validate-source]
    runs-on: macos-26
    timeout-minutes: 55
    environment: android-build
    env:
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      # Explicit user approval for only these disposable test app entitlements.
      EMOSONIC_MAC_LAB_NETWORK_APPROVED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch fixed private client without retained credentials
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: python3 scripts/handoff_repair_check.py source fetch
      - name: Checkout fixed public isolated server
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jsdfhasuh/Emosonic-Server
          ref: 8e9a319002c0ffa6054cd98e06dd271070ed729b
          path: .native-server
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Adapt only the disposable harness server guard
        run: python3 scripts/handoff_repair_check.py native prepare
      - name: Install real isolated server dependencies without logging private output
        run: python3 scripts/handoff_repair_check.py native dependencies
      - name: Validate native measurement boundaries
        run: python3 scripts/handoff_repair_check.py native unit
      - name: Preflight actual HTTP media and strict registration before compilation
        run: python3 scripts/handoff_repair_check.py native preflight
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: false
      - name: Compile three sandboxed same-source native test clients
        run: python3 scripts/handoff_repair_check.py native build
      - name: Measure actual Handoff delayed preparation and cancellation
        run: python3 scripts/handoff_repair_check.py native handoff
      - name: Measure actual follower transfer and restoration
        run: python3 scripts/handoff_repair_check.py native follow
      - name: Verify native processes stopped and remove owned test bundles and server
        id: native-cleanup
        if: always()
        run: python3 scripts/handoff_repair_check.py native cleanup
      - name: Remove private source and build diagnostics after verified native teardown
        if: ${{ always() && steps.native-cleanup.outcome == 'success' }}
        run: python3 scripts/handoff_repair_check.py source cleanup
      # No native test bundles, private profiles, raw logs or source artifacts uploaded.
