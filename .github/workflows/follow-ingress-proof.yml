name: Follow ingress expected-red proof

on:
  push:
    branches: [main]
    paths: [requests/follow-ingress-proof-20261022.json]

permissions:
  contents: read

concurrency:
  group: emosonic-follow-ingress-proof-20261022
  cancel-in-progress: false

env:
  SOURCE_SHA: '28b05652403eab21100e8960e94bfabed331482e'
  BUILD_VERSION: '1.0.10+27'

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: >-
      github.repository == 'jsdfhasuh/emosonic-build' && github.ref == 'refs/heads/main' &&
      github.event_name == 'push' && github.event.before == 'a3684c1076046c70a7dc9d40278a3badcaa0dcfb' &&
      github.event.head_commit.message == 'test: diagnose ingress fixture await phases 20261022' && github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: android-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check public gate logic
        run: python3 -m unittest discover -s tests -v
      - name: Verify immutable test-only source pin
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          SOURCE_REF: refs/heads/test/follow-ingress-barrier-diagnostics-20261022
        run: python3 scripts/follow_ingress_proof.py source prepare

  expected-red:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: android-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: false
      - name: Fetch fixed private test-only descendant
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
        run: python3 scripts/follow_ingress_proof.py source fetch
      - name: Require sole causal failure and two successful controls
        run: python3 scripts/follow_ingress_proof.py source red
      - name: Remove private source and generated outputs
        if: always()
        run: python3 scripts/follow_ingress_proof.py source cleanup
